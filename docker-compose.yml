services:
  haxball:
    build: .
    container_name: haxball-headless
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: "host"
    working_dir: /usr/src/app
    environment:
      - HAXBALL_TOKEN=${HAXBALL_TOKEN}
      - HAXBALL_ROOM_NAME=${HAXBALL_ROOM_NAME}
      - HAXBALL_MAX_PLAYERS=${HAXBALL_MAX_PLAYERS:-16}
      - HAXBALL_SCORE_LIMIT=${HAXBALL_SCORE_LIMIT:-3}
      - HAXBALL_TIME_LIMIT=${HAXBALL_TIME_LIMIT:-4}
      - HAXBALL_PROMOTION_COUNT=${HAXBALL_PROMOTION_COUNT:-4}
      - HAXBALL_PUBLIC=${HAXBALL_PUBLIC:-1}
      - ROOM_LANGUAGE=${ROOM_LANGUAGE:-tr}
      - HAXBALL_LANGUAGE=${HAXBALL_LANGUAGE:-}
      - LANGUAGE=${LANGUAGE:-}
      - HAXBALL_ADMIN_PASSWORD=${HAXBALL_ADMIN_PASSWORD}
      - CONFIG_ADMIN_CAN_BAN=${CONFIG_ADMIN_CAN_BAN:-1}
      - CONFIG_ADMIN_CAN_GIVE_ADMIN=${CONFIG_ADMIN_CAN_GIVE_ADMIN:-0}
      - CONFIG_ALLOW_MULTIPLE_JOIN=${CONFIG_ALLOW_MULTIPLE_JOIN:-0}
      - TZ=${TZ:-Europe/Amsterdam}
      - HAXBALL_BOT_NAME=${HAXBALL_BOT_NAME:-SpaceBot}
      - HAXBALL_BOT_NAMES=${HAXBALL_BOT_NAMES:-Messi,Ronaldo,Neymar,Mbappe,Haaland,Zidane,Ronaldinho,Modric}
      - HAXBALL_BOT_MAX=${HAXBALL_BOT_MAX:-8}
      - HAXBALL_BOT_AVATAR=${HAXBALL_BOT_AVATAR:-🤖}
      - HAXBALL_BOT_AUTOSTART=${HAXBALL_BOT_AUTOSTART:-4}
      - HAXBALL_BOT_LEARNING=${HAXBALL_BOT_LEARNING:-1}
      - HAXBALL_BOT_LEARNING_FILE=${HAXBALL_BOT_LEARNING_FILE:-db/bot-learning.json}
      - CHAT_COOLDOWN_MS=${CHAT_COOLDOWN_MS:-3000}
      - CHAT_MAX_LENGTH=${CHAT_MAX_LENGTH:-60}
      - CHAT_ADMIN_COLOR=${CHAT_ADMIN_COLOR:-CC99FF}
      - CHAT_NORMAL_COLOR=${CHAT_NORMAL_COLOR:-FFFFFF}
      - ADMIN_REQUEST_COOLDOWN_MS=${ADMIN_REQUEST_COOLDOWN_MS:-900000}
      - ADMIN_REQUEST_ANNOUNCE_MS=${ADMIN_REQUEST_ANNOUNCE_MS:-300000}
      - AFK_COOLDOWN_MS=${AFK_COOLDOWN_MS:-600000}
      - AFK_MIN_DURATION_MS=${AFK_MIN_DURATION_MS:-30000}
      - AFK_MAX_DURATION_MS=${AFK_MAX_DURATION_MS:-900000}
      - AFK_EARLY_WARNING_MS=${AFK_EARLY_WARNING_MS:-10000}
      - INACTIVITY_KICK_MS=${INACTIVITY_KICK_MS:-30000}
      - INACTIVITY_WARNING_MS=${INACTIVITY_WARNING_MS:-25000}
      - INACTIVITY_CHECK_MS=${INACTIVITY_CHECK_MS:-1000}
      - AUTO_RESTORE_CHECK_MS=${AUTO_RESTORE_CHECK_MS:-30000}
      - TEAM_COLOR_RED_ANGLE=${TEAM_COLOR_RED_ANGLE:-60}
      - TEAM_COLOR_RED_TEXT=${TEAM_COLOR_RED_TEXT:-E3E3E3}
      - TEAM_COLOR_RED_COLORS=${TEAM_COLOR_RED_COLORS:-C90209}
      - TEAM_COLOR_BLUE_ANGLE=${TEAM_COLOR_BLUE_ANGLE:-60}
      - TEAM_COLOR_BLUE_TEXT=${TEAM_COLOR_BLUE_TEXT:-E3E3E3}
      - TEAM_COLOR_BLUE_COLORS=${TEAM_COLOR_BLUE_COLORS:-0272BD}
    volumes:
      - ./db:/usr/src/app/db
      - ./maps:/usr/src/app/maps
    command: npm start
