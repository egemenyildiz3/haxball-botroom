services:
  haxball:
    build: .
    container_name: haxball-headless
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: "host"
    working_dir: /usr/src/app
    environment:
      - HAXBALL_TOKEN=${HAXBALL_TOKEN}
      - HAXBALL_ROOM_NAME=${HAXBALL_ROOM_NAME}
      - HAXBALL_MAX_PLAYERS=${HAXBALL_MAX_PLAYERS:-16}
      - HAXBALL_SCORE_LIMIT=${HAXBALL_SCORE_LIMIT:-3}
      - HAXBALL_TIME_LIMIT=${HAXBALL_TIME_LIMIT:-4}
      - HAXBALL_PROMOTION_COUNT=${HAXBALL_PROMOTION_COUNT:-4}
      - HAXBALL_PUBLIC=${HAXBALL_PUBLIC:-1}
      - HAXBALL_ADMIN_PASSWORD=${HAXBALL_ADMIN_PASSWORD}
      - CONFIG_ADMIN_CAN_BAN=${CONFIG_ADMIN_CAN_BAN:-1}
      - CONFIG_ADMIN_CAN_GIVE_ADMIN=${CONFIG_ADMIN_CAN_GIVE_ADMIN:-0}
      - CONFIG_ALLOW_MULTIPLE_JOIN=${CONFIG_ALLOW_MULTIPLE_JOIN:-0}
      - TZ=${TZ:-Europe/Amsterdam}
      - HAXBALL_BOT_NAME=${HAXBALL_BOT_NAME:-SpaceBot}
      - HAXBALL_BOT_MAX=${HAXBALL_BOT_MAX:-8}
      - HAXBALL_BOT_AVATAR=${HAXBALL_BOT_AVATAR:-🤖}
      - HAXBALL_BOT_AUTOSTART=${HAXBALL_BOT_AUTOSTART:-4}
      - HAXBALL_BOT_LEARNING=${HAXBALL_BOT_LEARNING:-1}
      - HAXBALL_BOT_LEARNING_FILE=${HAXBALL_BOT_LEARNING_FILE:-db/bot-learning.json}
    volumes:
      - ./db:/usr/src/app/db
      - ./maps:/usr/src/app/maps
    command: npm start
