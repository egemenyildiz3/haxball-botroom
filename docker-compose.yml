services:
  haxball:
    build: .
    container_name: haxball-headless
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: "host"
    working_dir: /usr/src/app
    environment:
      - HAXBALL_TOKEN=${HAXBALL_TOKEN}
      - HAXBALL_TOKEN_FILE=${HAXBALL_TOKEN_FILE:-/run/haxball/spacebounce-botroom-token.txt}
      - HAXBALL_ADMIN_PASSWORD=${HAXBALL_ADMIN_PASSWORD}
      - CONFIG_FILE=${CONFIG_FILE:-/usr/src/app/config/config.json}
      - TZ=${TZ:-Europe/Amsterdam}
    volumes:
      - ./config:/usr/src/app/config:ro
      - ./db:/usr/src/app/db
      - ./logs:/usr/src/app/logs
      - ./maps:/usr/src/app/maps
      - /home/egemen/file-storage/haxball:/run/haxball:ro
    command: npm start
